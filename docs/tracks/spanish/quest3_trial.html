
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Level 3: The Gender Gatekeeper</title>

    <link rel="stylesheet" href="../../css/quest-style.css">

    <style>
        .gate-box {
            margin-top: 30px;
            background: #2c1808;
            border: 4px solid #f1c40f;
            padding: 32px;
            border-radius: 16px;
            text-align: center;
        }

        .word {
            font-size: 42px;
            font-weight: 900;
            color: #f1c40f;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 20px;
            color: #f4eac8;
            margin-bottom: 28px;
            opacity: 0.85;
            font-weight: 700;
        }

        .btn-la {
            background: #e74c3c;
            color: white;
        }

        #feedback {
            margin-top: 18px;
            font-size: 20px;
            font-weight: 900;
            text-align: center;
        }

        .shake {
            animation: shake 0.25s linear;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
    </style>
</head>

<body>

    <div class="parchment">
        <h2>Gender Gatekeeper</h2>
        <p>Choose EL (masculine) or LA (feminine)</p>

        <div class="gate-box">
            <div id="wordDisplay" class="word">Loading...</div>
            <div id="meaningDisplay" class="meaning"></div>

            <button onclick="choose('el')">EL</button>
            <button onclick="choose('la')">LA</button>

            <p id="feedback"></p>

            <button onclick="location.href='spanish-level.html'">Back to Map</button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const WORDS = [
                { word: "gato", meaning: "cat", gender: "el" },
                { word: "casa", meaning: "house", gender: "la" },
                { word: "libro", meaning: "book", gender: "el" },
                { word: "silla", meaning: "chair", gender: "la" },
                { word: "perro", meaning: "dog", gender: "el" },
                { word: "mesa", meaning: "table", gender: "la" },
                { word: "zapato", meaning: "shoe", gender: "el" },
                { word: "flor", meaning: "flower", gender: "la" },
                { word: "árbol", meaning: "tree", gender: "el" },
                { word: "ciudad", meaning: "city", gender: "la" }
            ];

            let index = 0;

            const wordDisplay = document.getElementById("wordDisplay");
            const meaningDisplay = document.getElementById("meaningDisplay");
            const feedback = document.getElementById("feedback");

            /* ---------- BACKEND SAVE ---------- */
            async function saveProgress(questName) {
                const email = localStorage.getItem("userEmail");
                if (!email) return;

                try {
                    await fetch("http://localhost:5000/progress", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            quest: questName
                        })
                    });

                    console.log("Progress saved");
                } catch (err) {
                    console.log("Progress save failed");
                }
            }

            function loadWord() {
                const w = WORDS[index];
                wordDisplay.textContent = w.word;
                meaningDisplay.textContent = `(${w.meaning})`;
                feedback.textContent = "";
            }

            window.choose = function(choice) {
                const correct = WORDS[index].gender;

                if (choice === correct) {
                    feedback.textContent = "✨ Correct!";
                    feedback.style.color = "green";

                    index++;

                    if (index >= WORDS.length) {

                        // ✅ COMPLETE QUEST
                        localStorage.setItem("s3Complete", "1");

                        // ✅ BACKEND SAVE (same as Python)
                        saveProgress("Spanish-quest3");

                        feedback.textContent = "🏆 Level 3 Complete!";

                        setTimeout(() => {
                            location.href = "spanish-level.html";
                        }, 1200);

                        return;
                    }

                    setTimeout(loadWord, 400);

                } else {
                    feedback.textContent = "❌ Wrong! Try again.";
                    feedback.style.color = "red";
                }
            };

            loadWord();
        });
    </script>

</body>

</html>
