<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Level 4: Spanish Verb Mastery</title>

    <link rel="stylesheet" href="../../css/quest-style.css">

    <style>
        body {
            font-family: "Segoe UI", sans-serif;
        }

        .parchment {
            padding: 25px;
        }

        h2 {
            margin-bottom: 10px;
            text-align: center;
        }

        .storybook-box {
            background: #f7f1d4;
            border: 2px solid #c8b07a;
            padding: 18px;
            border-radius: 14px;
            width: min(600px, 95vw);
            margin: auto;
            line-height: 1.55;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
            text-align: center;
            font-weight: 700;
        }

        .table-block {
            background: #fffaf0;
            border: 2px solid #c8b07a;
            border-radius: 14px;
            padding: 14px;
            margin-top: 14px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-bottom: 1px solid #e7d9b7;
            font-weight: 700;
        }

        .row:last-child {
            border-bottom: none;
        }

        .question-box {
            margin-top: 18px;
            background: #fff5da;
            border: 2px solid #c8b07a;
            padding: 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-weight: 700;
            text-align: center;
            display: none;
        }

        .crystal-container {
            margin-top: 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            display: none;
        }

        .crystal {
            width: 120px;
            padding: 14px;
            background: #d9c7a7;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-size: 18px;
            font-weight: 900;
            transition: transform 0.15s ease;
        }

        .crystal:hover {
            transform: scale(1.05);
        }

        .crystal.correct {
            background: #8fe388;
            border: 2px solid #3b7a31;
        }

        .crystal.wrong {
            background: #ffb5b5;
            border: 2px solid #b43636;
        }
        #feedback {
            margin-top: 16px;
            font-weight: 900;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="parchment">
        <h2>Verb Mastery</h2>

        <div id="teachingBox"></div>
        <div id="conjTable" class="table-block"></div>
        <div id="questionBox"></div>
        <div id="options"></div>

        <p id="feedback"></p>

        <button onclick="location.href='spanish-level.html'">Back</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const PRONOUNS = ["yo", "tú", "él", "ella", "nosotros", "ellos"];

            const VERBS = [
                { verb: "ser", forms: ["soy", "eres", "es", "es", "somos", "son"] },
                { verb: "estar", forms: ["estoy", "estás", "está", "está", "estamos", "están"] },
                { verb: "tener", forms: ["tengo", "tienes", "tiene", "tiene", "tenemos", "tienen"] }
            ];

            let round = 0;

            function loadRound() {
                const data = VERBS[round];

                document.getElementById("teachingBox").innerText =
                    `Verb: ${data.verb}`;

                let table = "";
                PRONOUNS.forEach((p, i) => {
                    table += `<div class="row">${p} - ${data.forms[i]}</div>`;
                });

                document.getElementById("conjTable").innerHTML = table;

                askQuestion(data);
            }

            function askQuestion(data) {
                const i = Math.floor(Math.random() * PRONOUNS.length);
                const correct = data.forms[i];

                document.getElementById("questionBox").innerText =
                    `Choose correct form for "${PRONOUNS[i]}"`;

                const options = shuffle([
                    correct,
                    data.forms[Math.floor(Math.random() * 6)],
                    data.forms[Math.floor(Math.random() * 6)]
                ]);

                const container = document.getElementById("options");
                container.innerHTML = "";

                options.forEach(opt => {
                    const div = document.createElement("div");
                    div.className = "crystal";
                    div.innerText = opt;

                    div.onclick = () => {
                        if (opt === correct) {
                            div.classList.add("correct");
                            nextRound();
                        } else {
                            div.classList.add("wrong");
                        }
                    };

                    container.appendChild(div);
                });
            }

            function nextRound() {
                round++;
                if (round >= VERBS.length) {
                    localStorage.setItem("s4Complete", "1");

                    setTimeout(() => {
                        location.href = "spanish-level.html";
                    }, 1000);
                    return;
                }

                setTimeout(loadRound, 500);
            }

            function shuffle(arr) {
                return arr.sort(() => Math.random() - 0.5);
            }

            loadRound();
        });
    </script>

</body>

</html>
