
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Level 2: Spanish Number Match-Up</title>

    <link rel="stylesheet" href="../../css/quest-style.css">

    <style>
        .match-container {
            display: flex;
            justify-content: space-around;
            gap: 30px;
            margin-top: 22px;
            flex-wrap: wrap;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 260px;
        }

        .box {
            padding: 14px 18px;
            background: #3e2712;
            color: #f1c40f;
            border: 2px solid #f1c40f;
            cursor: pointer;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .box.selected {
            background: #f1c40f;
            color: #3e2712;
        }

        .box.matched {
            opacity: 0.3;
            pointer-events: none;
        }

        #feedback {
            margin-top: 16px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="parchment">
        <h2>Match Spanish Numbers</h2>
        <p>Select a Spanish word, then match its number.</p>

        <div class="match-container">
            <div class="column" id="valuesCol"></div>
            <div class="column" id="typesCol"></div>
        </div>

        <p id="feedback"></p>

        <button onclick="location.href='spanish-level.html'">Back to Map</button>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const PAIRS = [
                { value: "uno", type: "1" },
                { value: "dos", type: "2" },
                { value: "tres", type: "3" },
                { value: "cuatro", type: "4" },
                { value: "cinco", type: "5" },
                { value: "seis", type: "6" },
                { value: "siete", type: "7" },
                { value: "ocho", type: "8" },
                { value: "nueve", type: "9" },
                { value: "diez", type: "10" }
            ];

            const valuesCol = document.getElementById("valuesCol");
            const typesCol = document.getElementById("typesCol");
            const feedback = document.getElementById("feedback");

            let selected = null;
            let matched = 0;
            const total = PAIRS.length;

            /* ---------- BACKEND SAVE ---------- */
            async function saveProgress(questName) {
                const email = localStorage.getItem("userEmail");
                if (!email) return;

                try {
                    await fetch("http://localhost:5000/progress", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            quest: questName
                        })
                    });

                    console.log("Progress saved");
                } catch (err) {
                    console.log("Progress save failed");
                }
            }

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function buildGame() {
                valuesCol.innerHTML = "";
                typesCol.innerHTML = "";

                const values = shuffle([...PAIRS]);
                const types = shuffle([...PAIRS]);

                values.forEach((item, i) => {
                    const el = document.createElement("div");
                    el.className = "box";
                    el.textContent = item.value;
                    el.dataset.id = i;
                    el.onclick = () => selectValue(el, item);
                    valuesCol.appendChild(el);
                });

                types.forEach((item, i) => {
                    const el = document.createElement("div");
                    el.className = "box";
                    el.textContent = item.type;
                    el.dataset.id = i;
                    el.onclick = () => selectType(el, item);
                    typesCol.appendChild(el);
                });
            }

            function selectValue(el, item) {
                selected = { el, item };
                document.querySelectorAll(".box").forEach(b => b.classList.remove("selected"));
                el.classList.add("selected");
                feedback.textContent = "Now pick the number!";
            }

            function selectType(el, item) {
                if (!selected) {
                    feedback.textContent = "Pick a word first!";
                    return;
                }

                if (selected.item.type === item.type) {

                    selected.el.classList.add("matched");
                    el.classList.add("matched");

                    matched++;
                    feedback.textContent = "✨ Correct!";

                    if (matched === total) {

                        feedback.textContent = "🏆 All matched!";

                        // ✅ COMPLETE QUEST
                        localStorage.setItem("s2Complete", "1");

                        // ✅ BACKEND SAVE
                        saveProgress("Spanish-quest2");

                        setTimeout(() => {
                            location.href = "spanish-level.html";
                        }, 1200);
                    }

                } else {
                    feedback.textContent = "❌ Wrong! Try again.";
                }

                selected = null;
                document.querySelectorAll(".box").forEach(b => b.classList.remove("selected"));
            }

            buildGame();
        });
    </script>

</body>

</html>
