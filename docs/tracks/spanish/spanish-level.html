<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestEd | Spanish Map</title>

    <link rel="stylesheet" href="../../css/python-level.css">
</head>

<body>

    <div class="pixel-clouds">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 right c1">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 left c2">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 right c3">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-3 left c4">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-3 right c5">
    </div>

    <nav class="game-nav">
        <button class="nav-btn" onclick="location.href='../../hub/skillselection.html'">🏠 Home</button>
        <button class="nav-btn active">🗺️ Map</button>
        <button class="nav-btn" onclick="location.href='../../hub/profile.html'">👤 Profile</button>
    </nav>

    <div class="full-screen-map">

        <div class="parchment-container">
            <h1>Spanish: Quest Map</h1>
            <div id="allCompleteBanner" class="all-complete" style="display:none;">
                🏆 All Spanish Quests Completed!
            </div>
        </div>

        <!-- Levels (NO "current" in HTML) -->
        <div class="waypoint" id="lvl1" data-href="quest1_trial.html" style="top: 80%; left: 12%;">
            <div class="pin"></div>
            <span class="label">Level 1</span>
        </div>

        <div class="waypoint locked" id="lvl2" data-href="quest2_trial.html" style="top: 78%; left: 35%;">
            <div class="pin"></div>
            <span class="label">Level 2</span>
        </div>

        <div class="waypoint locked" id="lvl3" data-href="quest3_trial.html" style="top: 54%; left: 50%;">
            <div class="pin"></div>
            <span class="label">Level 3</span>
        </div>

        <div class="waypoint locked" id="lvl4" data-href="quest4_trial.html" style="top: 48%; left: 75%;">
            <div class="pin"></div>
            <span class="label">Level 4</span>
        </div>

        <div class="waypoint locked" id="lvl5" data-href="quest5_trial.html" style="top: 25%; left: 90%;">
            <div class="pin"></div>
            <span class="label">Level 5</span>
        </div>

    </div>

    <script>
        console.log("📍 Spanish Map Loaded");

        // ✅ STRONG guest detection
        const userEmail = localStorage.getItem("userEmail");
        const isRealGuest = !userEmail || userEmail === "guest";

        // ✅ Progress flags
        const s1Done = localStorage.getItem("s1Complete") === "1";
        const s2Done = localStorage.getItem("s2Complete") === "1";
        const s3Done = localStorage.getItem("s3Complete") === "1";
        const s4Done = localStorage.getItem("s4Complete") === "1";
        const s5Done = localStorage.getItem("s5Complete") === "1";

        const lvl1 = document.getElementById("lvl1");
        const lvl2 = document.getElementById("lvl2");
        const lvl3 = document.getElementById("lvl3");
        const lvl4 = document.getElementById("lvl4");
        const lvl5 = document.getElementById("lvl5");

        function makeClickable(el) {
            if (!el) return;
            el.classList.remove("locked");
            el.onclick = () => location.href = el.dataset.href;
        }

        function lock(el, customHandler = null) {
            if (!el) return;
            el.classList.add("locked");

            if (customHandler) {
                el.onclick = customHandler;
            } else {
                el.onclick = () => alert("🔒 Complete previous level!");
            }
        }

        function unlock(el) {
            if (!el) return;
            el.classList.remove("locked");
            makeClickable(el);
        }

        function markCompleted(el) {
            if (!el) return;
            el.classList.add("completed");
            el.classList.remove("current");
        }

        function setCurrent(el) {
            if (!el) return;
            el.classList.add("current");
        }

        // ✅ Level 1 always clickable
        makeClickable(lvl1);

        // ✅ Unlock logic (before marking completed, so completed state isn't overridden)
        if (s1Done) {
            if (isRealGuest) {
                lock(lvl2, () => {
                    if (confirm("🔒 Sign up to unlock all levels!")) {
                        location.href = "../../auth/signup.html";
                    }
                });
            } else {
                unlock(lvl2);
            }
        } else {
            lock(lvl2);
        }

        if (s2Done && !isRealGuest) {
            unlock(lvl3);
        } else {
            lock(lvl3);
        }

        if (s3Done && !isRealGuest) {
            unlock(lvl4);
        } else {
            lock(lvl4);
        }

        if (s4Done && !isRealGuest) {
            unlock(lvl5);
        } else {
            lock(lvl5);
        }

        // ✅ Mark completed levels (after unlock logic so completed styling isn't lost)
        if (s1Done) markCompleted(lvl1);
        if (s2Done && !isRealGuest) markCompleted(lvl2);
        if (s3Done && !isRealGuest) markCompleted(lvl3);
        if (s4Done && !isRealGuest) markCompleted(lvl4);
        if (s5Done && !isRealGuest) markCompleted(lvl5);

        // ✅ Current level logic (derived from data flags, not DOM state)
        function setCurrentLevel() {
            const levels = [lvl1, lvl2, lvl3, lvl4, lvl5];
            levels.forEach(el => el.classList.remove("current"));

            const unlockedAndIncomplete = [
                { el: lvl1, done: s1Done, unlocked: true },
                { el: lvl2, done: s2Done, unlocked: s1Done && !isRealGuest },
                { el: lvl3, done: s3Done, unlocked: s2Done && !isRealGuest },
                { el: lvl4, done: s4Done, unlocked: s3Done && !isRealGuest },
                { el: lvl5, done: s5Done, unlocked: s4Done && !isRealGuest },
            ];

            for (const { el, done, unlocked } of unlockedAndIncomplete) {
                if (!done && unlocked) return setCurrent(el);
            }

            document.getElementById("allCompleteBanner").style.display = "block";
        }

        setCurrentLevel();

        // 🧪 Debug log
        console.log({
            userEmail,
            isRealGuest,
            s1Done, s2Done, s3Done, s4Done, s5Done
        });
    </script>

</body>

</html>
