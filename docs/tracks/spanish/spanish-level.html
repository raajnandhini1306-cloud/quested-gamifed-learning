<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Navigate the Spanish Quest Map. Complete levels to unlock new challenges and master Spanish vocabulary.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>QuestEd | Spanish Map</title>
    <link rel="stylesheet" href="../../css/python-level.css">
</head>

<body>

    <div class="pixel-clouds">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 right c1">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 left c2">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-1 right c3">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-3 left c4">
        <img src="../../assets/cloud3.png" class="pixel-cloud cloud-3 right c5">
    </div>

    <nav class="game-nav">
        <a href="../../hub/skillselection.html" class="nav-btn" style="text-decoration:none;">🏠 Home</a>
        <a href="#" class="nav-btn active" style="text-decoration:none; pointer-events: none;">🗺️ Map</a>
        <a href="../../hub/profile.html" class="nav-btn" style="text-decoration:none;">👤 Profile</a>
    </nav>

    <div class="full-screen-map">

        <div class="parchment-container">
            <h1>Spanish: Quest Map</h1>
            <div id="allCompleteBanner" class="all-complete" style="display:none;">
                🏆 All Spanish Quests Completed!
            </div>
        </div>

        <div class="waypoint" id="lvl1" data-href="quest1_trial.html" style="top: 80%; left: 12%;">
            <div class="pin"></div>
            <span class="label">Level 1</span>
        </div>

        <div class="waypoint locked" id="lvl2" data-href="quest2_trial.html" style="top: 78%; left: 35%;">
            <div class="pin"></div>
            <span class="label">Level 2</span>
        </div>

        <div class="waypoint locked" id="lvl3" data-href="quest3_trial.html" style="top: 54%; left: 50%;">
            <div class="pin"></div>
            <span class="label">Level 3</span>
        </div>

        <div class="waypoint locked" id="lvl4" data-href="quest4_trial.html" style="top: 48%; left: 75%;">
            <div class="pin"></div>
            <span class="label">Level 4</span>
        </div>

        <div class="waypoint locked" id="lvl5" data-href="quest5_trial.html" style="top: 25%; left: 90%;">
            <div class="pin"></div>
            <span class="label">Level 5</span>
        </div>

    </div>

    <script src="../../js/auth.js"></script>
    <script>
        console.log("📍 Spanish Map Loaded");

        // 1. Authentication Guard
        if (typeof checkAuth === 'function') {
            checkAuth('../../auth/login.html');
        }

        const userEmail = localStorage.getItem("userEmail");
        const isGuest = () => !userEmail || userEmail === "guest";

        // 2. Progress Flags (Specific to Spanish)
        const s1Done = localStorage.getItem("s1Complete") === "1";
        const s2Done = localStorage.getItem("s2Complete") === "1";
        const s3Done = localStorage.getItem("s3Complete") === "1";
        const s4Done = localStorage.getItem("s4Complete") === "1";
        const s5Done = localStorage.getItem("s5Complete") === "1";

        const lvl1 = document.getElementById("lvl1");
        const lvl2 = document.getElementById("lvl2");
        const lvl3 = document.getElementById("lvl3");
        const lvl4 = document.getElementById("lvl4");
        const lvl5 = document.getElementById("lvl5");
        const allLevels = [lvl1, lvl2, lvl3, lvl4, lvl5];

        // 3. Reusable Helper Functions (Identical to Python logic)
        function makeClickable(el) {
            if (!el) return;
            el.classList.remove("locked");
            el.onclick = () => {
                const href = el.dataset.href;
                if (href) location.href = href;
            };
        }

        function lock(el) {
            if (!el) return;
            el.classList.add("locked");
            el.onclick = () => alert("🔒 Complete the previous level first!");
        }

        function markCompleted(el) {
            if (!el) return;
            el.classList.add("completed");
            el.classList.remove("current");
            makeClickable(el); // Keep it clickable after completion
        }

        function unlockWithAnim(el) {
            if (!el) return;
            el.classList.remove("locked");
            el.classList.add("unlocking");
            setTimeout(() => el.classList.remove("unlocking"), 700);
            makeClickable(el);
        }

        function setCurrent(el) {
            if (!el) return;
            el.classList.add("current");
            el.classList.remove("locked");
        }

        function checkGuestAccess(nextLevelEl) {
            if (isGuest()) {
                nextLevelEl.classList.add("locked");
                nextLevelEl.onclick = () => {
                    const signup = confirm("🔒 Trial Complete!\n\nGuest Mode only allows the first level.\n\nSign up to unlock all Spanish levels?");
                    if (signup) location.href = "../../auth/signup.html";
                };
                return true;
            }
            return false;
        }

        // 4. Unlock Logic
        makeClickable(lvl1); // Level 1 is always available

        // Level 2 Logic
        if (s1Done) {
            if (!checkGuestAccess(lvl2)) unlockWithAnim(lvl2);
        } else {
            lock(lvl2);
        }

        // Higher Levels (Strict Auth Required)
        if (s2Done && !isGuest()) unlockWithAnim(lvl3); else if (!s2Done) lock(lvl3);
        if (s3Done && !isGuest()) unlockWithAnim(lvl4); else if (!s3Done) lock(lvl4);
        if (s4Done && !isGuest()) unlockWithAnim(lvl5); else if (!s4Done) lock(lvl5);

        // 5. Completion Styling
        if (s1Done) markCompleted(lvl1);
        if (s2Done && !isGuest()) markCompleted(lvl2);
        if (s3Done && !isGuest()) markCompleted(lvl3);
        if (s4Done && !isGuest()) markCompleted(lvl4);
        if (s5Done && !isGuest()) markCompleted(lvl5);

        // 6. Set Current Level logic
        function setCurrentLevel() {
            allLevels.forEach(el => el && el.classList.remove("current"));

            const progress = [s1Done, s2Done, s3Done, s4Done, s5Done];
            
            for (let i = 0; i < allLevels.length; i++) {
                // If this level is not done and it's either lvl 1 or the previous was done
                const prevDone = i === 0 || progress[i-1];
                
                if (!progress[i] && prevDone) {
                    // Only mark as visual "current" if it's not a guest-blocked level
                    if (i === 0 || !isGuest()) {
                        setCurrent(allLevels[i]);
                    }
                    return; // Stop once we find the first incomplete level
                }
            }

            // All complete
            if (progress.every(p => p === true) && !isGuest()) {
                const banner = document.getElementById("allCompleteBanner");
                if (banner) banner.style.display = "block";
            }
        }

        setCurrentLevel();
    </script>

</body>

</html>
