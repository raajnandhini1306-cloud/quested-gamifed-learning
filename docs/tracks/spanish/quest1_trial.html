<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Spanish Adventure Quest</title>

    <link rel="stylesheet" href="../../css/quest-style.css">
</head>

<body>

    <div class="parchment">
        <h1 class="quest-title" style="margin-top: 10px;">The Spanish Adventure Quest</h1>

        <div class="lesson-content">

            <!-- HUD -->
            <div class="hud">
                <div class="task-chip" id="taskChip">Task</div>

                <div class="progress-wrap">
                    <div class="progress-text">
                        <span id="progressText">Progress: 0%</span>
                        <span id="taskCount">1 / 10</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
            </div>

            <div id="taskInstr">Loading...</div>

            <input id="userAnswer" class="quest-input-box" placeholder="Write your answer...">

            <div class="btn-row">
                <button class="game-btn btn-primary" id="submitBtn">Submit</button>
                <button class="game-btn btn-secondary" id="nextBtn" style="display:none;">Next</button>
                <button class="game-btn btn-secondary" id="resetBtn">Reset Quest</button>
                <button class="game-btn btn-secondary" onclick="location.href='spanish-level.html'">Back to Map</button>
            </div>

            <p id="feedback" class="feedback"></p>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {

            let currentTask = localStorage.getItem('spanishQuestC')
                ? parseInt(localStorage.getItem('spanishQuestC'))
                : 0;

            const tasks = [
                {
                    instr: `Hello traveler!<br>Type: <strong>hola</strong>`,
                    answer: 'hola'
                },
                {
                    instr: `Say thank you.<br>Type: <strong>gracias</strong>`,
                    answer: 'gracias'
                },
                {
                    instr: `Say goodbye.<br>Type: <strong>adios</strong>`,
                    answer: 'adios'
                },
                {
                    instr: `Friend in Spanish?<br>Type: <strong>amigo</strong>`,
                    answer: 'amigo'
                },
                {
                    instr: `Water in Spanish?<br>Type: <strong>agua</strong>`,
                    answer: 'agua'
                },
                {
                    instr: `House in Spanish?<br>Type: <strong>casa</strong>`,
                    answer: 'casa'
                },
                {
                    instr: `Red in Spanish?<br>Type: <strong>rojo</strong>`,
                    answer: 'rojo'
                },
                {
                    instr: `Food in Spanish?<br>Type: <strong>comida</strong>`,
                    answer: 'comida'
                },
                {
                    instr: `Happy in Spanish?<br>Type: <strong>feliz</strong>`,
                    answer: 'feliz'
                },
                {
                    instr: `Learned in Spanish?<br>Type: <strong>aprendido</strong>`,
                    answer: 'aprendido'
                }
            ];

            const taskInstr = document.getElementById("taskInstr");
            const progressFill = document.getElementById("progressFill");
            const progressText = document.getElementById("progressText");
            const taskCount = document.getElementById("taskCount");
            const nextBtn = document.getElementById("nextBtn");
            const feedback = document.getElementById("feedback");
            const userAnswer = document.getElementById("userAnswer");
            const submitBtn = document.getElementById("submitBtn");
            const resetBtn = document.getElementById("resetBtn");

            function updateHUD() {
                const percent = Math.round((currentTask / tasks.length) * 100);
                taskChip.textContent = `Task ${currentTask + 1}`;
                progressText.textContent = `Progress: ${percent}%`;
                taskCount.textContent = `${Math.min(currentTask + 1, tasks.length)} / ${tasks.length}`;
                progressFill.style.width = percent + "%";
            }

            function loadTask() {
                if (currentTask >= tasks.length) {
                    taskInstr.innerHTML = "🎉 Quest Completed!";
                    feedback.textContent = "Returning to map...";

                    localStorage.setItem("s1Complete", "1");

                    setTimeout(() => {
                        location.href = "spanish-level.html";
                    }, 1500);

                    return;
                }

                updateHUD();
                feedback.textContent = "";
                taskInstr.innerHTML = tasks[currentTask].instr;
                userAnswer.value = "";
                nextBtn.style.display = "none";
            }

            function checkAnswer() {
                const val = userAnswer.value.trim().toLowerCase();

                if (val === tasks[currentTask].answer) {
                    feedback.textContent = "✅ Correct!";
                    nextBtn.style.display = "inline-block";

                    currentTask++;
                    localStorage.setItem("spanishQuestC", currentTask);
                } else {
                    feedback.textContent = "❌ Try again!";
                }
            }

            submitBtn.addEventListener("click", checkAnswer);
            nextBtn.addEventListener("click", loadTask);

            resetBtn.addEventListener("click", () => {
                currentTask = 0;
                localStorage.removeItem("spanishQuestC");
                loadTask();
            });

            loadTask();
        });
    </script>

</body>

</html>
