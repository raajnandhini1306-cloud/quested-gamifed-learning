<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Sign up for QuestEd to start your educational journey. Create your adventurer profile and learn skills like a game.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>QuestEd | Sign Up</title>
    <link rel="stylesheet" href="../css/quest-style.css" />
    <link rel="stylesheet" href="../css/auth.css">
</head>


<body>

    <div class="float-layer">
        <div class="sparkle s1">✨</div>
        <div class="sparkle s2">✨</div>
        <div class="sparkle s3">✨</div>
        <div class="sparkle s4">✨</div>
    </div>

    <div class="auth-wrap">

        <!-- LEFT -->
        <div class="card brand">
            <span class="tag">🧙 QuestEd Academy</span>
            <h1>Sign Up</h1>
            <p>Create your adventurer identity and start learning like a game.</p>

            <p class="helper">
                ✅ Progress Saved<br>
                ✅ Badges Unlocked<br>
                ✅ Quests + Map System
            </p>

            <div class="btn-row" style="margin-top: 12px;">
                <a href="../index.html" class="btn dark" style="text-decoration: none; text-align: center;">⬅ Home</a>
                <a href="login.html" class="btn dark" style="text-decoration: none; text-align: center;">Login</a>
                <button onclick="startGuestSession('../hub/skillselection.html')" class="btn"
                    style="text-decoration: none; text-align: center; background: #f1c40f; color: #3e2712; font-size: 0.9em; border:none; cursor:pointer;">Guest</button>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="card">
            <div id="msg" class="msg"></div>

            <form class="form" onsubmit="signup(event); return false;">
                <div class="input-group">
                    <input class="input" id="name" placeholder=" " required />
                    <label for="name">Player Name</label>
                </div>

                <div class="input-group">
                    <input class="input" id="email" type="email" placeholder=" " required />
                    <label for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <input class="input" id="pass" type="password" placeholder=" " required />
                    <label for="pass">Password (min 6 chars)</label>
                </div>

                <div class="input-group">
                    <input class="input" id="confirm" type="password" placeholder=" " required />
                    <label for="confirm">Confirm Password</label>
                </div>

                <div class="btn-row">
                    <button class="btn primary" type="submit">✨ Create Account</button>
                    <button class="btn dark" type="button" onclick="clearForm()">Clear</button>
                </div>

                <p class="helper">
                    Already have an account?
                    <a class="link" href="login.html">Login</a>


                </p>
            </form>
        </div>

    </div>

    <script src="../js/auth.js"></script>

</body>

</html>
