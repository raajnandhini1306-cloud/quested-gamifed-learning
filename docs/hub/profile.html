<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="description"
        content="View your QuestEd profile, track your progress, badges, and stats as you master new skills.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>QuestEd | Profile</title>
    <link rel="stylesheet" href="../css/quest-style.css" />
    <link rel="stylesheet" href="../css/auth.css">


    <style>
        body {
            /* Override auth.css grid display if needed, but quest-style + local style should hold */
            background: url("../assets/bg5.jpg") no-repeat center center fixed;

            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 14px;
            font-family: 'Macondo', cursive;
        }

        /* ... rest of styles ... */


        .profile-wrap {
            width: min(980px, 95vw);
            transform: translateY(25px);
            /* Fixed cutoff by removing negative translate */
            position: relative;
            z-index: 5;
        }

        /* ... */

        .avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: transparent;
            /* Transparent for pixel art */
            border: 4px solid transparent;
            /* No border ring */
            box-shadow: 0 20px 55px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            position: relative;
            display: flex;
            /* Center content */
            justify-content: center;
            align-items: center;
        }

        .avatar::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: 999px;
            box-shadow: 0 0 22px rgba(241, 196, 15, 0.35);
            pointer-events: none;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* Full pixel art visible */
            display: block;
            transform: scale(1.25);
            /* Zoom to fill */
        }


        .float-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .float {
            position: absolute;
            opacity: 0.75;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.15));
        }

        .cloud {
            width: 180px;
            height: 90px;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            box-shadow:
                60px 0 0 rgba(255, 255, 255, 0.7),
                120px 10px 0 rgba(255, 255, 255, 0.6);
            animation: cloudMove 24s linear infinite;
        }

        .c1 {
            top: 10%;
            left: -20%;
            transform: scale(1.1);
            animation-duration: 30s;
        }

        .c2 {
            top: 22%;
            left: -35%;
            transform: scale(0.8);
            animation-duration: 38s;
            opacity: 0.6;
        }

        .c3 {
            top: 42%;
            left: -30%;
            transform: scale(1.35);
            animation-duration: 45s;
            opacity: 0.5;
        }

        .sparkle {
            font-size: 22px;
            opacity: 0.65;
            animation: sparkleFloat 4s ease-in-out infinite;
        }

        .s1 {
            top: 20%;
            left: 12%;
            animation-delay: 0s;
        }

        .s2 {
            top: 55%;
            left: 8%;
            animation-delay: 1s;
            font-size: 18px;
        }

        .s3 {
            top: 30%;
            left: 78%;
            animation-delay: 0.6s;
            font-size: 26px;
        }

        .s4 {
            top: 62%;
            left: 90%;
            animation-delay: 1.4s;
            font-size: 20px;
        }

        @keyframes cloudMove {
            from {
                transform: translateX(0) scale(1);
            }

            to {
                transform: translateX(140vw) scale(1);
            }
        }

        @keyframes sparkleFloat {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-16px) rotate(8deg);
            }
        }

        .profile-title-row {
            display: flex;
            gap: 14px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }



        .profile-title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .profile-title h1 {
            margin: 0;
            font-size: 64px;

            background: linear-gradient(90deg,
                    #BF953F 0%,
                    #FCF6BA 25%,
                    #FBF5B7 50%,
                    #FCF6BA 75%,
                    #BF953F 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;

            filter: drop-shadow(0px 4px 4px rgba(0, 0, 0, 0.5));
        }

        .sub {
            opacity: 0.9;
            font-weight: 900;
            color: #3e2712;
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 14px;
        }

        @media (max-width: 880px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(244, 228, 188, 0.60);
            border: 4px solid #3e2712;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 22px 70px rgba(0, 0, 0, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.28);
        }

        .section-title {
            margin: 0 0 10px;
            font-size: 22px;
            color: #2c1808;
        }

        .progress-row {
            display: flex;
            justify-content: space-between;
            font-weight: 900;
            opacity: 0.9;
            margin-bottom: 8px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .progress-bar {
            height: 12px;
            width: 100%;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.16);
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #16a34a, #22c55e);
            transition: width 0.4s ease;
        }

        .quest-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 14px;
        }

        .quest-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 14px;
            border: 2px solid rgba(62, 39, 18, 0.25);
            background: rgba(255, 255, 255, 0.35);
            font-weight: 900;
        }

        .quest-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chip {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-weight: 900;
            border: 2px solid rgba(62, 39, 18, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .chip.done {
            background: rgba(34, 197, 94, 0.35);
            border-color: rgba(20, 83, 45, 0.5);
        }

        .chip.lock {
            background: rgba(0, 0, 0, 0.08);
            opacity: 0.8;
        }

        .quest-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .mini-btn {
            padding: 8px 10px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 900;
            transition: 0.15s;
            font-family: 'Macondo', cursive;
        }

        .mini-btn:hover {
            transform: translateY(-1px);
        }

        .mini-btn.play {
            background: #8e44ad;
            color: white;
        }

        .mini-btn.info {
            background: #3e2712;
            color: #f4e4bc;
        }

        .mini-btn.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .badge-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .badge {
            border: 2px solid rgba(62, 39, 18, 0.25);
            border-radius: 14px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.35);
            font-weight: 900;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .badge-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            border: 2px solid rgba(62, 39, 18, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .badge.done .badge-icon {
            background: rgba(34, 197, 94, 0.35);
            border-color: rgba(20, 83, 45, 0.5);
        }

        .badge.locked {
            opacity: 0.55;
            filter: grayscale(1);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 14px;
        }

        .danger {
            background: #e74c3c;
            color: white;
        }

        .safe {
            background: #27ae60;
            color: white;
        }

        .neutral {
            background: #3e2712;
            color: #f4e4bc;
        }

        .big-btn {
            padding: 12px 16px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-weight: 900;
            transition: 0.2s;
            font-family: 'Macondo', cursive;
        }

        .big-btn:hover {
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        @media (max-width: 520px) {
            .stats {
                grid-template-columns: 1fr;
            }
        }

        .stat {
            border-radius: 14px;
            border: 2px solid rgba(62, 39, 18, 0.25);
            background: rgba(255, 255, 255, 0.35);
            padding: 12px;
            font-weight: 900;
        }

        .stat .num {
            font-size: 26px;
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="float-layer">
        <div class="float cloud c1"></div>
        <div class="float cloud c2"></div>
        <div class="float cloud c3"></div>

        <div class="float sparkle s1">✨</div>
        <div class="float sparkle s2">✨</div>
        <div class="float sparkle s3">✨</div>
        <div class="float sparkle s4">✨</div>
    </div>

    <div class="profile-wrap">

        <!-- Header -->
        <div class="profile-title-row">
            <div class="avatar">
                <img id="avatarImg" src="../assets/avatar.jpg" alt="Avatar">

            </div>

            <div class="profile-title">
                <h1>Profile</h1>
                <div class="sub" id="playerName">Adventurer</div>

                <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;">
                    <input id="nameInput" placeholder="Set your name..."
                        style="padding:8px 10px; border-radius:12px; border:2px solid rgba(62,39,18,0.35); font-weight:900; font-family: 'Macondo', cursive;" />
                    <button class="mini-btn play" onclick="saveName()">Save</button>
                    <button class="mini-btn info" onclick="location.href='../tracks/python/python-level.html'">🗺️ Back
                        to Map</button>

                </div>
            </div>
        </div>

        <div class="grid">
            <!-- LEFT -->
            <!-- LEFT -->
            <div class="card">
                <h2 class="section-title">🐍 Python Path</h2>

                <div class="progress-row">
                    <span id="pyProgressText">Progress: 0 / 5</span>
                    <span id="pyProgressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="pyProgressFill"></div>
                </div>
                <!-- PYTHON LIST -->
                <div class="quest-list" id="questListPython"></div>

                <hr style="border:0; border-top:2px solid rgba(62,39,18,0.2); margin:20px 0;">

                <h2 class="section-title">🇪🇸 Spanish Path</h2>

                <div class="progress-row">
                    <span id="spProgressText">Progress: 0 / 5</span>
                    <span id="spProgressPercent">0%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="spProgressFill"></div>
                </div>
                <!-- SPANISH LIST -->
                <div class="quest-list" id="questListSpanish"></div>


                <div class="btn-row" style="margin-top:24px;">
                    <button class="big-btn neutral" onclick="location.href='skillselection.html'">🏠 Skill
                        Selection</button>
                    <button class="mini-btn" style="background:#e74c3c;color:white;"
                        onclick="logout('../auth/login.html')">🚪
                        Logout</button>
                </div>

                <div class="btn-row">
                    <button class="big-btn danger" onclick="resetPython()">Reset Python</button>
                    <button class="big-btn danger" onclick="resetSpanish()">Reset Spanish</button>
                    <button class="big-btn danger" style="background:#2c3e50;" onclick="resetAll()">Reset
                        ALL</button>
                </div>
            </div>

            <!-- RIGHT -->
            <div class="card">
                <h2 class="section-title">📊 Stats</h2>

                <div class="stats">
                    <div class="stat">Quests Done<div class="num" id="questsDone">0</div>
                    </div>
                    <div class="stat">Total Quests<div class="num" id="totalQuests">10</div>
                    </div>
                    <div class="stat">Completion<div class="num" id="completionNum">0%</div>
                    </div>
                </div>

                <h2 class="section-title" style="margin-top:24px;">🏅 Badges</h2>

                <h3 style="margin: 10px 0 6px; opacity:0.8;">🐍 Python Badges</h3>
                <div class="badge-grid" id="pyBadgeGrid"></div>

                <h3 style="margin: 20px 0 6px; opacity:0.8;">🇪🇸 Spanish Badges</h3>
                <div class="badge-grid" id="spBadgeGrid"></div>
            </div>
        </div>

    </div>

    <script>
        // --- DATA TRACKING ---

        // PYTHON DATA
        const qTask = localStorage.getItem("qTask") ? parseInt(localStorage.getItem("qTask")) : 0;
        const pyStats = [
            qTask >= 10,
            localStorage.getItem("q2Complete") === "1",
            localStorage.getItem("q3Complete") === "1",
            localStorage.getItem("q4Complete") === "1",
            localStorage.getItem("q5Complete") === "1"
        ];

        const pythonQuests = [
            { id: 1, name: "Quest 1: Basics", done: pyStats[0], badge: "Snake Charmer", icon: "🐍", info: "../tracks/python/q1info.html", game: "../tracks/python/quest1-game.html" },
            { id: 2, name: "Quest 2: Types", done: pyStats[1], badge: "Data Keeper", icon: "💾", info: "../tracks/python/q2info.html", game: "../tracks/python/quest2-game.html" },
            { id: 3, name: "Quest 3: Loops", done: pyStats[2], badge: "Loop Master", icon: "🔄", info: "../tracks/python/q3info.html", game: "../tracks/python/quest3-game.html" },
            { id: 4, name: "Quest 4: Functions", done: pyStats[3], badge: "Function Smith", icon: "⚒️", info: "../tracks/python/q4info.html", game: "../tracks/python/quest4-game.html" },
            { id: 5, name: "Quest 5: Final", done: pyStats[4], badge: "Dragon Slayer", icon: "⚔️", info: "../tracks/python/q5info.html", game: "../tracks/python/quest5-game.html" },
        ];

        // SPANISH DATA
        const spStats = [
            localStorage.getItem("s1Complete") === "1",
            localStorage.getItem("s2Complete") === "1",
            localStorage.getItem("s3Complete") === "1",
            localStorage.getItem("s4Complete") === "1",
            localStorage.getItem("s5Complete") === "1"
        ];

        const spanishQuests = [
            { id: 1, name: "Quest 1: Basics", done: spStats[0], badge: "El Novato", icon: "🌱", info: "../tracks/spanish/quest1_trial.html", game: "../tracks/spanish/quest1_trial.html" },
            { id: 2, name: "Quest 2: Numbers", done: spStats[1], badge: "El Contador", icon: "🔢", info: "../tracks/spanish/quest2_trial.html", game: "../tracks/spanish/quest2_trial.html" },
            { id: 3, name: "Quest 3: Gender", done: spStats[2], badge: "El Lingüista", icon: "📖", info: "../tracks/spanish/quest3_trial.html", game: "../tracks/spanish/quest3_trial.html" },
            { id: 4, name: "Quest 4: Verbs", done: spStats[3], badge: "Conjugator", icon: "✍️", info: "../tracks/spanish/quest4_trial.html", game: "../tracks/spanish/quest4_trial.html" },
            { id: 5, name: "Quest 5: Boss", done: spStats[4], badge: "El Campeón", icon: "👑", info: "../tracks/spanish/quest5_trial.html", game: "../tracks/spanish/quest5_trial.html" },
        ];


        // --- LOGIC ---

        function percent(n, total) {
            if (total === 0) return 0;
            return Math.round((n / total) * 100);
        }

        // Generic List Builder
        function renderTrack(containerId, quests, prevCompletedCheck = false) {
            const list = document.getElementById(containerId);
            list.innerHTML = "";

            quests.forEach((q, index) => {
                let locked = false;
                if (index > 0) {
                    if (!quests[index - 1].done) locked = true;
                }

                const item = document.createElement("div");
                item.className = "quest-item";

                const left = document.createElement("div");
                left.className = "quest-left";

                const chip = document.createElement("div");
                chip.className = "chip " + (q.done ? "done" : "lock");
                chip.textContent = q.done ? "✓" : (locked ? "🔒" : "○");

                const title = document.createElement("div");
                title.textContent = q.name;

                left.appendChild(chip);
                left.appendChild(title);

                const actions = document.createElement("div");
                actions.className = "quest-actions";

                const playBtn = document.createElement("button");
                playBtn.className = "mini-btn play " + (locked ? "locked" : "");
                playBtn.textContent = "Play";
                playBtn.onclick = () => {
                    if (locked) {
                        alert("🔒 Complete the previous quest first!");
                        return;
                    }
                    location.href = q.game;
                };

                actions.appendChild(playBtn);
                item.appendChild(left);
                item.appendChild(actions);
                list.appendChild(item);
            });
        }

        function updateStats() {
            // Python
            const pyDone = pythonQuests.filter(q => q.done).length;
            const pyTotal = pythonQuests.length;
            const pyPct = percent(pyDone, pyTotal);

            document.getElementById("pyProgressText").innerText = `Progress: ${pyDone} / ${pyTotal}`;
            document.getElementById("pyProgressPercent").innerText = `${pyPct}%`;
            document.getElementById("pyProgressFill").style.width = pyPct + "%";

            // Spanish
            const spDone = spanishQuests.filter(q => q.done).length;
            const spTotal = spanishQuests.length;
            const spPct = percent(spDone, spTotal);

            document.getElementById("spProgressText").innerText = `Progress: ${spDone} / ${spTotal}`;
            document.getElementById("spProgressPercent").innerText = `${spPct}%`;
            document.getElementById("spProgressFill").style.width = spPct + "%";

            // Global
            const totalDone = pyDone + spDone;
            const grandTotal = pyTotal + spTotal;
            const totalPct = percent(totalDone, grandTotal);

            document.getElementById("questsDone").innerText = totalDone;
            const tq = document.getElementById("totalQuests");
            if (tq) tq.innerText = grandTotal;
            document.getElementById("completionNum").innerText = totalPct + "%";
        }

        function renderBadges(containerId, quests) {
            const grid = document.getElementById(containerId);
            if (!grid) return;
            grid.innerHTML = "";

            quests.forEach(q => {
                const div = document.createElement("div");
                div.className = "badge " + (q.done ? "done" : "locked");

                div.innerHTML = `
                    <div class="badge-icon">${q.icon || "🏆"}</div>
                    <div>
                        <div style="font-size:0.9rem;">${q.badge}</div>
                        <div style="opacity:0.6; font-size:0.75rem;">${q.done ? "Unlocked" : "Locked"}</div>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function buildBadges() {
            renderBadges("pyBadgeGrid", pythonQuests);
            renderBadges("spBadgeGrid", spanishQuests);
        }

        // --- GLOBAL RESETS ---
        function resetPython() {
            if (!confirm("Reset Python progress only?")) return;
            localStorage.removeItem("qTask");
            localStorage.removeItem("q2Complete");
            localStorage.removeItem("q3Complete");
            localStorage.removeItem("q4Complete");
            localStorage.removeItem("q5Complete");
            location.reload();
        }

        function resetSpanish() {
            if (!confirm("Reset Spanish progress only?")) return;
            localStorage.removeItem("s1Complete");
            localStorage.removeItem("s2Complete");
            localStorage.removeItem("s3Complete");
            localStorage.removeItem("s4Complete");
            localStorage.removeItem("s5Complete");
            location.reload();
        }

        function resetAll() {
            if (!confirm("RESET EVERYTHING?")) return;
            localStorage.clear();
            location.reload();
        }

        // --- USER PROFILE ---
        const savedName = localStorage.getItem("playerName");
        const savedUser = JSON.parse(localStorage.getItem("questedUser") || "{}");
        if (savedName) document.getElementById("playerName").innerText = savedName;
        if (savedUser.avatar) document.getElementById("avatarImg").src = "../" + savedUser.avatar;

        function saveName() {
            const input = document.getElementById("nameInput").value.trim();
            if (!input) return;
            localStorage.setItem("playerName", input);
            document.getElementById("playerName").innerText = input;
            const user = JSON.parse(localStorage.getItem("questedUser") || "{}");
            user.name = input;
            localStorage.setItem("questedUser", JSON.stringify(user));
            document.getElementById("nameInput").value = "";
        }

        document.getElementById("avatarImg").onerror = function () {
            this.src = "https://i.imgur.com/7k12EPD.png";
        };

        // --- INIT ---
        renderTrack("questListPython", pythonQuests, true);
        renderTrack("questListSpanish", spanishQuests, true);
        updateStats();
        buildBadges();
    </script>

    <script src="../js/auth.js"></script>
    <script>checkAuth('../auth/login.html');</script>

</body>

</html>
