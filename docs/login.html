<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Login to QuestEd to continue your gamified learning journey. recover your progress and badges.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>QuestEd | Login</title>
    <link rel="stylesheet" href="css/quest-style.css" />
    <link rel="stylesheet" href="css/auth.css" />
</head>

<body>

    <div class="float-layer">
        <div class="sparkle s1">✨</div>
        <div class="sparkle s2">✨</div>
        <div class="sparkle s3">✨</div>
        <div class="sparkle s4">✨</div>
    </div>

    <div class="auth-wrap">

        <!-- LEFT -->
        <div class="card brand">
            <span class="tag">🧙 QuestEd Academy</span>
            <h1>Login</h1>
            <p>Welcome back, adventurer. Continue your quests.</p>

            <p class="helper">
                ✅ Progress Saved<br>
                ✅ Badges Unlocked<br>
                ✅ Quests + Map System
            </p>

            <div class="btn-row" style="margin-top: 12px;">
                <a href="index.html" class="btn dark" style="text-decoration: none; text-align: center;">⬅
                    Back</a>
                <a href="signup.html" class="btn dark" style="text-decoration: none; text-align: center;">Create
                    Account</a>
            </div>
        </div>

        <!-- RIGHT -->
        <div class="card">
            <div id="msg" class="msg"></div>

            <form class="form" onsubmit="login(event)">
                <div class="input-group">
                    <input class="input" id="email" type="email" placeholder=" " required />
                    <label for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <input class="input" id="pass" type="password" placeholder=" " required />
                    <label for="pass">Password</label>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                    <label for="remember"
                        style="display: flex; align-items: center; gap: 6px; font-size: 0.9rem; font-weight: 700; color: #3e2712; cursor: pointer; margin: 0;">
                        <input type="checkbox" id="remember"
                            style="accent-color: #8e44ad; width: 16px; height: 16px; cursor: pointer;" />
                        Remember Me
                    </label>
                    <a onclick="forgotPassword()"
                        style="font-size:0.9rem; color:#8e44ad; cursor:pointer; font-weight:900; text-decoration: none;">Forgot
                        Password?</a>
                </div>

                <div class="btn-row">
                    <button class="btn primary" type="submit">⚡ Enter QuestEd</button>
                    <button class="btn dark" type="button" onclick="fillDemo()">Use Saved Account</button>
                </div>

                <p class="helper">
                    No account yet?
                    <a class="link" href="signup.html">Sign Up</a>
                </p>
            </form>
        </div>

    </div>

    <script src="js/auth.js"></script>
</body>

</html>
